<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My waters | Coop's Fishing</title>
  <meta name="description" content="Your saved fishing waters.">
  <link rel="icon" href="assets/images/logo-mark.jpg" type="image/jpeg">
  <link rel="apple-touch-icon" href="assets/images/logo-mark.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="spots">
<div id="site-top"></div>
<main>
<section id="spots">
  <div class="wrap">
    <div class="section-head">
      <span class="eyebrow">Account</span>
      <h2>My waters</h2>
      <p>Saved spots live here. Star a water from its report or the spots list.</p>
    </div>
    <p class="status-line" id="favStatus">Loading…</p>
    <div class="spots-grid" id="favGrid"></div>
  </div>
</section>
</main>
<div id="site-bottom"></div>
<script src="assets/js/chrome.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/national.js"></script>
<script src="assets/js/depths.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script>
  (async function () {
    const status = document.getElementById('favStatus');
    const grid = document.getElementById('favGrid');
    const start = Date.now();
    while (Date.now() - start < 5000 && !(window.COOPS && COOPS.account)) {
      await new Promise((r) => setTimeout(r, 100));
    }
    function draw() {
      const acc = COOPS.account;
      if (!acc || !acc.user) {
        status.innerHTML = 'Log in (top right) to save and see your waters.';
        grid.innerHTML = '';
        return;
      }
      const ids = [...acc.favs];
      const spots = (COOPS.spots || []).filter((s) => ids.indexOf(s.id) !== -1);
      if (!spots.length) {
        status.innerHTML = 'No saved waters yet. Open a spot and hit <strong>Save this water</strong>.';
        grid.innerHTML = '';
        return;
      }
      status.textContent = spots.length + ' saved';
      grid.innerHTML = spots
        .map((s) => {
          return (
            '<article class="spot-card"><a class="spot-card-main" href="location.html?water=' +
            s.id +
            '"><div class="spot-badge">' +
            s.region +
            '</div><h3>' +
            s.name +
            '</h3><p class="spot-state">' +
            s.state +
            '</p><p class="spot-why">' +
            s.why +
            '</p><span class="card-more"><i class="fa-solid fa-circle-info"></i> More info</span></a>' +
            '<button type="button" class="fav-btn" data-fav="' +
            s.id +
            '">Saved</button></article>'
          );
        })
        .join('');
      if (acc.bindFavs) acc.bindFavs();
    }
    draw();
    setInterval(draw, 1500);
  })();
</script>
<script src="assets/js/track.js"></script>
</body>
</html>
