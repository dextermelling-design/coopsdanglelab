[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

# NOAA blocks browser CORS; this keeps Great Lakes / coastal buoy temps working.
[[redirects]]
  from = "/api/ndbc/*"
  to = "/.netlify/functions/ndbc?id=:splat"
  status = 200

[[redirects]]
  from = "/api/feedback"
  to = "/.netlify/functions/feedback"
  status = 200

[[redirects]]
  from = "/api/hit"
  to = "/.netlify/functions/hit"
  status = 200
